
name: Deploy Frontend FoodBridge

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'deploy/oracle/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publicar frontend na Oracle após homologação'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: frontend-producao
  cancel-in-progress: false

jobs:
  deploy:
    # Publicacao continua em push na main, com testes, SSH pinado e rollback.
    # Pull requests nunca publicam. Nenhuma flag de variavel bloqueia push.
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
      )
    environment: oracle-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Testes de sessao
        run: npm run test:session

      - name: Analise estatica
        run: npm run lint

      - name: Gerar build
        run: npm run build

      - name: Empacotar frontend
        run: tar -czf frontend.tar.gz -C dist .

      - name: Configurar SSH com fingerprint dedicada e host pinado
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for nome in SSH_KEY KNOWN_HOSTS; do
            test -n "${!nome:-}" || { echo "::error::Configuração ausente: $nome"; exit 1; }
          done
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key -P '' > ~/.ssh/deploy_key.pub
          FINGERPRINT="$(ssh-keygen -lf ~/.ssh/deploy_key.pub -E sha256 | awk '{print $2}')"
          [[ "$FINGERPRINT" == 'SHA256:3zV6jlZeYgt19xz4h0KrumznEr3SNlyAEiolj+XrmO8' ]] || {
            echo '::error::Chave RSA dedicada inesperada'; exit 1;
          }

      - name: Enviar build para Oracle Cloud
        env:
          VM_HOST: ${{ vars.OCI_SSH_HOST }}
          VM_USER: ${{ vars.OCI_SSH_USER }}
        run: |
          scp -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
            -o IdentityAgent=none -i ~/.ssh/deploy_key \
            frontend.tar.gz \
            "${VM_USER}@${VM_HOST}:/tmp/foodbridge-frontend-${GITHUB_SHA}.tar.gz"

      - name: Publicar no Nginx com rollback
        env:
          VM_HOST: ${{ vars.OCI_SSH_HOST }}
          VM_USER: ${{ vars.OCI_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VM_HOST" && test -n "$VM_USER"
          SOMA="$(sha256sum frontend.tar.gz | awk '{print $1}')"
          ssh -o IdentityAgent=none -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -i ~/.ssh/deploy_key \
            "${VM_USER}@${VM_HOST}" \
            "bash -se -- '${GITHUB_SHA}' '${SOMA}'" < deploy/oracle/atualizar-frontend.sh

      - name: Confirmar deployment no Nginx da VM e reportar HTTP externo
        shell: bash
        env:
          VM_HOST: ${{ vars.OCI_SSH_HOST }}
          VM_USER: ${{ vars.OCI_SSH_USER }}
        run: |
          set -euo pipefail
          echo "Deploy frontend concluido no commit ${GITHUB_SHA}"
          LOCAL_CODE="$(ssh -o IdentityAgent=none -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -i ~/.ssh/deploy_key "${VM_USER}@${VM_HOST}" "curl --noproxy '*' --silent --show-error --connect-timeout 3 --max-time 15 --output /dev/null --write-out '%{http_code}' http://127.0.0.1/")"
          [[ "$LOCAL_CODE" == '200' ]] || { echo "::error::Nginx local nao respondeu HTTP 200: $LOCAL_CODE"; exit 1; }
          echo "FRONTEND_NGINX_LOCAL_HTTP=200"
          PUBLIC_CODE="$(curl -4 --noproxy '*' --silent --connect-timeout 5 --max-time 15 --output /dev/null --write-out '%{http_code}' "http://${VM_HOST}/" || true)"
          echo "FRONTEND_EXTERNAL_HTTP=${PUBLIC_CODE:-unavailable}"
          if [[ "$PUBLIC_CODE" != '200' ]]; then
            echo "::warning::Resposta externa do GitHub runner: ${PUBLIC_CODE:-sem conexao}; verificar WAF/politica do IP publico. O deploy local foi confirmado no Nginx."
          fi

      - name: Remover chave temporária
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/deploy_key.pub
