name: FoodBridge Web - CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:session
      - run: npm run lint
      - run: npm run build
      - name: Publicar build React aprovado para implantacao pela VM
        uses: actions/upload-artifact@v4
        with:
          name: foodbridge-frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
